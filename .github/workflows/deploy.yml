name: Deploy to VPS

# Runs docker compose up -d --build on the production VPS whenever this
# branch is pushed, then hits the app's health endpoint to confirm it came
# back up. No third-party SSH action - plain openssh-client, so the only
# thing with access to the deploy key is this repo's own runner.
on:
  push:
    branches: [claude/web-app-project-avh8op]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd "${{ secrets.VPS_PROJECT_DIR }}"
            git fetch origin
            git checkout claude/web-app-project-avh8op
            git reset --hard origin/claude/web-app-project-avh8op
            docker compose up -d --build
            docker compose ps
          '

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ secrets.VPS_HEALTHCHECK_HOST }}/api/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Not up yet, retrying in 5s ($i/10)..."
            sleep 5
          done
          echo "Health check failed after retries"
          exit 1
