<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Book Reading Platform</title>
<style>
  body { width: 260px; font-family: system-ui, sans-serif; padding: 14px; color: #1b1b1b; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; margin: 8px 0 2px; color: #555; }
  input { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
  button { margin-top: 10px; width: 100%; padding: 8px; border: none; border-radius: 8px; background: #2a5c8a; color: #fff; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #logoutBtn { background: #9a9488; margin-top: 6px; }
  #toggleBtn { background: #2f8f4e; }
  .error { color: #c0392b; font-size: 12px; margin-top: 6px; min-height: 14px; }
  .accountRow { font-size: 13px; margin-bottom: 8px; }
  a { color: #2a5c8a; font-size: 12px; display: inline-block; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Book Reading Platform</h1>

  <div id="authSection">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="loginBtn" type="button">Log in</button>
    <div id="loginError" class="error"></div>
  </div>

  <div id="accountSection" hidden>
    <div class="accountRow">Signed in as <strong id="accountEmail"></strong></div>
    <button id="toggleBtn" type="button">Start Reading Mode</button>
    <button id="logoutBtn" type="button">Log out</button>
    <a href="#" id="optionsLink">Highlight colors…</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
