<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Reading Mode options</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 24px; max-width: 440px; color: #1b1b1b; }
  h1 { font-size: 18px; margin-top: 0; }
  p { font-size: 13px; color: #555; line-height: 1.5; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
  .row span { font-size: 14px; }
  input[type=color] { width: 48px; height: 32px; border: none; padding: 0; background: none; cursor: pointer; }
  button { margin-top: 16px; margin-right: 8px; padding: 8px 16px; border: none; border-radius: 8px; background: #2a5c8a; color: #fff; cursor: pointer; font-size: 13px; }
  #resetBtn { background: #9a9488; }
  #saved { font-size: 13px; color: #2f8f4e; margin-left: 10px; }
</style>
</head>
<body>
  <h1>Reading Mode highlight colors</h1>
  <p>
    These colors highlight German words on any webpage while Reading Mode is
    on &mdash; the same known / learning / new colors used on the website itself,
    which you can override here.
  </p>
  <div class="row"><span>Known words (learned or passively understood)</span><input id="known" type="color" /></div>
  <div class="row"><span>Words you're learning</span><input id="learning" type="color" /></div>
  <div class="row"><span>New / unseen words</span><input id="unset" type="color" /></div>
  <button id="saveBtn" type="button">Save</button>
  <button id="resetBtn" type="button">Reset to defaults</button>
  <span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
